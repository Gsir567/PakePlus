 
<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹贪吃蛇·进化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.0.0/css/fontawesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .neon-glow {
                filter: drop-shadow(0 0 8px rgba(0, 255, 0, 0.6)) 
                        drop-shadow(0 0 16px rgba(0, 255, 0, 0.3));
            }
            .food-glow {
                filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.8)) 
                        drop-shadow(0 0 24px rgba(255, 0, 0, 0.4));
            }
            .portal-glow {
                filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.7)) 
                        drop-shadow(0 0 30px rgba(0, 255, 255, 0.5));
            }
            .poison-glow {
                filter: drop-shadow(0 0 10px rgba(150, 0, 255, 0.8)) 
                        drop-shadow(0 0 20px rgba(150, 0, 255, 0.4));
            }
            .speed-glow {
                filter: drop-shadow(0 0 10px rgba(255, 255, 0, 0.8)) 
                        drop-shadow(0 0 20px rgba(255, 255, 0, 0.4));
            }
            .control-glow {
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
            }
        }
    </style>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Exo 2', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            background-image: radial-gradient(circle at 20% 30%, #0a0a0a 1%, transparent 1%),
                            radial-gradient(circle at 80% 70%, #111 1%, transparent 1%);
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(45deg, #000, #2c2c2c);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.2), 
                        inset 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .ui-panel {
            position: absolute;
            color: #0f0;
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 20px 30px;
            z-index: 5;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .legend-item:hover { opacity: 1; }
        .score-display { color: #fff; }

        .neon-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 48px;
            font-size: 20px;
            font-weight: 700;
            color: #0f0;
            background: transparent;
            border: 3px solid #0f0;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s;
            z-index: 10;
        }

        .neon-button:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        .game-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .game-over-text {
            font-size: 64px;
            color: #0f0;
            text-shadow: 0 0 15px #0f0, 0 0 30px #0f0;
            animation: pulse 1.5s infinite;
        }

        .final-score {
            font-size: 32px;
            color: #fff;
            opacity: 0.9;
        }

        .control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 5;
        }

        .control-button {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 0, 0.6);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(0, 255, 0, 0.8);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-button:hover {
            background: rgba(0, 255, 0, 0.2);
            color: #0f0;
            border-color: #0f0;
        }

        .help-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            border-radius: 16px;
            padding: 20px 30px;
            color: #fff;
            z-index: 20;
            overflow-y: auto;
            display: none;
        }

        .help-title {
            font-size: 28px;
            color: #0f0;
            margin-bottom: 15px;
            text-align: center;
        }

        .help-content p {
            margin-bottom: 10px;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            color: #0f0;
            cursor: pointer;
        }

        .difficulty-indicator {
            position: absolute;
            top: 80px;
            left: 30px;
            color: rgba(0, 255, 0, 0.7);
            font-size: 14px;
            z-index: 5;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style></head><body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="ui-panel">
            <div class="legend">
                <div class="legend-item"><i class="fa fa-circle text-red-500"></i> 食物 (+10分)</div>
                <div class="legend-item"><i class="fa fa-star text-yellow-400"></i> 加速果 (+15分)</div>
                <div class="legend-item"><i class="fa fa-bomb text-purple-600"></i> 毒苹果 (-5分)</div>
                <div class="legend-item"><i class="fa fa-share text-blue-500"></i> 传送门 (+20分)</div>
            </div>

            <div class="score-display">
                <span id="scoreValue">分数: 0</span> | 
                <span id="livesValue">生命: 3</span> | 
                <span id="levelValue">关卡: 1</span>
            </div>
        </div>

        <div class="difficulty-indicator">
            <span id="difficultyValue">难度: 简单</span>
        </div>

        <button class="neon-button" onclick="startGame()">
            <i class="fa fa-play"></i> 开始游戏
        </button>

        <div class="control-panel">
            <div class="control-button" onclick="mobileControl('Up')">
                <i class="fa fa-chevron-up"></i>
            </div>
            <div class="control-button" onclick="mobileControl('Left')">
                <i class="fa fa-chevron-left"></i>
            </div>
            <div class="control-button" onclick="mobileControl('Down')">
                <i class="fa fa-chevron-down"></i>
            </div>
            <div class="control-button" onclick="mobileControl('Right')">
                <i class="fa fa-chevron-right"></i>
            </div>
            <div class="control-button" onclick="toggleHelp()">
                <i class="fa fa-question"></i>
            </div>
        </div>

        <div class="help-panel" id="helpPanel">
            <div class="close-button" onclick="toggleHelp()">
                <i class="fa fa-times"></i>
            </div>
            <div class="help-title">游戏帮助</div>
            <div class="help-content">
                <p><i class="fa fa-circle text-red-500"></i> <strong>食物</strong>: 普通食物，吃了增加10分和蛇的长度</p>
                <p><i class="fa fa-star text-yellow-400"></i> <strong>加速果</strong>: 临时增加蛇的速度，吃了增加15分</p>
                <p><i class="fa fa-bomb text-purple-600"></i> <strong>毒苹果</strong>: 吃了会减少分数并失去一条命</p>
                <p><i class="fa fa-share text-blue-500"></i> <strong>传送门</strong>: 传送到随机位置，吃了增加20分</p>
                <p><i class="fa fa-keyboard-o"></i> <strong>键盘控制</strong>: 使用方向键控制蛇的移动，空格键暂停/继续</p>
                <p><i class="fa fa-mobile"></i> <strong>触摸控制</strong>: 在屏幕上滑动控制方向</p>
                <p><i class="fa fa-level-up"></i> <strong>关卡系统</strong>: 每获得50分升一级，速度会逐渐加快</p>
                <p><i class="fa fa-heart"></i> <strong>生命值</strong>: 初始有3条命，撞到边界或自己的身体会失去一条命</p>
            </div>
        </div>
    </div>

    <script>
        // 游戏初始化和配置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameRunning = false;
        let gameLoopId = null;
        const WIDTH = 800, HEIGHT = 600, SQUARE_SIZE = 24;
        const BG_COLOR = '#000';
        const TEXT_COLOR = '#0f0';
        
        // 游戏状态
        let snake = [];
        let food = {};
        let poison = {};
        let speedFood = {};
        let portal = {};
        let direction = 'Right';
        let nextDirection = 'Right';
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameSpeed = 150;
        let lastTime = 0;
        let particles = [];
        let powerUpActive = false;
        let powerUpTime = 0;
        let portalActive = false;
        let portalCooldown = 0;
        let gameOver = false;
        let showStartGuide = true;
        let startGuideTimer = 0;
        
        // 图像资源
        const snakeHeadImg = new Image();
        snakeHeadImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230F0' d='M12,24L12,0L0,12Z'/%3E%3Ccircle cx='8' cy='8' r='2' fill='white'/%3E%3Ccircle cx='16' cy='8' r='2' fill='white'/%3E%3C/svg%3E";

        const foodImg = new Image();
        foodImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23F00' d='M12,2C6,2 2,6 2,12C2,18 6,22 12,22C18,22 22,18 22,12C22,6 18,2 12,2Z'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23FF6666'/%3E%3C/svg%3E";

        const poisonImg = new Image();
        poisonImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%239900FF' d='M12,2C6,2 2,6 2,12C2,18 6,22 12,22C18,22 22,18 22,12C22,6 18,2 12,2Z'/%3E%3Cpath fill='%23000' d='M12,6C8.686,6 6,8.686 6,12c0,3.314,2.686,6,6,6s6-2.686,6-6C18,8.686,15.314,6,12,6z M12,16c-2.206,0-4-1.794-4-4c0-2.206,1.794-4,4-4s4,1.794,4,4C16,14.206,14.206,16,12,16z'/%3E%3C/svg%3E";

        const speedImg = new Image();
        speedImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FFFF00' d='M12,2C6.5,2,2,6.5,2,12s4.5,10,10,10s10-4.5,10-10S17.5,2,12,2z M12,20c-4.4,0-8-3.6-8-8s3.6-8,8-8s8,3.6,8,8S16.4,20,12,20z'/%3E%3Cpath fill='%23000' d='M12,6c-0.6,0-1,0.4-1,1v4H7c-0.6,0-1,0.4-1,1s0.4,1,1,1h4v4c0,0.6,0.4,1,1,1s1-0.4,1-1v-4h4c0.6,0,1-0.4,1-1s-0.4-1-1-1h-4V7C13,6.4,12.6,6,12,6z'/%3E%3C/svg%3E";

        const portalImg = new Image();
        portalImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2300FFFF' d='M12,2C6.5,2,2,6.5,2,12s4.5,10,10,10s10-4.5,10-10S17.5,2,12,2z M12,20c-4.4,0-8-3.6-8-8s3.6-8,8-8s8,3.6,8,8S16.4,20,12,20z'/%3E%3Cpath fill='%23000' d='M16.5,12c0-2.5-2-4.5-4.5-4.5S7.5,9.5,7.5,12s2,4.5,4.5,4.5S16.5,14.5,16.5,12z M12,16c-2.2,0-4-1.8-4-4s1.8-4,4-4s4,1.8,4,4S14.2,16,12,16z'/%3E%3C/svg%3E";

        // 初始化游戏
        function initGame() {
            snake = [
                {x: 10 * SQUARE_SIZE, y: 10 * SQUARE_SIZE},
                {x: 9 * SQUARE_SIZE, y: 10 * SQUARE_SIZE},
                {x: 8 * SQUARE_SIZE, y: 10 * SQUARE_SIZE}
            ];
            
            direction = 'Right';
            nextDirection = 'Right';
            score = 0;
            level = 1;
            gameSpeed = 150;
            gameOver = false;
            showStartGuide = true;
            startGuideTimer = 0;
            updateUI();
            createFood();
            createPoison();
            createSpeedFood();
            portalCooldown = 0;
            portalActive = false;
            particles = [];
        }

        // 随机位置生成
        function getRandomPosition() {
            const maxX = Math.floor((WIDTH - SQUARE_SIZE) / SQUARE_SIZE);
            const maxY = Math.floor((HEIGHT - SQUARE_SIZE) / SQUARE_SIZE);
            return {
                x: Math.floor(Math.random() * maxX) * SQUARE_SIZE,
                y: Math.floor(Math.random() * maxY) * SQUARE_SIZE
            };
        }

        // 创建食物
        function createFood() {
            let position;
            do {
                position = getRandomPosition();
            } while (isPositionOnSnake(position) || 
                    (portalActive && isPositionOnPortal(position)) ||
                    isPositionOnPoison(position) ||
                    isPositionOnSpeedFood(position));
            
            food = position;
        }

        // 创建毒苹果
        function createPoison() {
            let position;
            do {
                position = getRandomPosition();
            } while (isPositionOnSnake(position) || 
                    isPositionOnFood(position) ||
                    (portalActive && isPositionOnPortal(position)) ||
                    isPositionOnSpeedFood(position));
            
            poison = position;
        }

        // 创建加速果
        function createSpeedFood() {
            let position;
            do {
                position = getRandomPosition();
            } while (isPositionOnSnake(position) || 
                    isPositionOnFood(position) ||
                    (portalActive && isPositionOnPortal(position)) ||
                    isPositionOnPoison(position));
            
            speedFood = position;
        }

        // 创建传送门
        function createPortal() {
            let position;
            do {
                position = getRandomPosition();
            } while (isPositionOnSnake(position) || 
                    isPositionOnFood(position) ||
                    isPositionOnPoison(position) ||
                    isPositionOnSpeedFood(position));
            
            portal = position;
            portalActive = true;
            portalCooldown = 300; // 传送门持续时间
        }

        // 碰撞检测辅助函数
        function isPositionOnSnake(position) {
            return snake.some(segment => segment.x === position.x && segment.y === position.y);
        }

        function isPositionOnFood(position) {
            return food.x === position.x && food.y === position.y;
        }

        function isPositionOnPoison(position) {
            return poison.x === position.x && poison.y === position.y;
        }

        function isPositionOnSpeedFood(position) {
            return speedFood.x === position.x && speedFood.y === position.y;
        }

        function isPositionOnPortal(position) {
            return portal.x === position.x && portal.y === position.y;
        }

        // 游戏主循环
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            
            if (deltaTime > gameSpeed) {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                drawBackground();
                
                // 显示游戏开始引导
                if (showStartGuide) {
                    drawStartGuide();
                    startGuideTimer++;
                    if (startGuideTimer > 60) {
                        showStartGuide = false;
                    }
                }
                
                // 更新游戏状态
                update();
                
                // 绘制游戏元素
                drawSnake();
                drawFood();
                drawPoison();
                if (powerUpActive) {
                    drawSpeedFood();
                    powerUpTime--;
                    if (powerUpTime <= 0) {
                        powerUpActive = false;
                        gameSpeed = 150 - (level - 1) * 10;
                    }
                }
                
                if (portalActive) {
                    drawPortal();
                    portalCooldown--;
                    if (portalCooldown <= 0) {
                        portalActive = false;
                    }
                }
                
                // 绘制方向指示器
                drawDirectionIndicator();
                
                // 绘制难度提示
                drawDifficultyHint();
                
                drawParticles();
                
                lastTime = timestamp;
            }
            
            if (gameRunning && !gameOver) {
                gameLoopId = requestAnimationFrame(gameLoop);
            }
        }

        // 更新游戏状态
        function update() {
            // 更新蛇的位置
            direction = nextDirection;
            
            const head = {x: snake[0].x, y: snake[0].y};
            
            switch(direction) {
                case 'Up': head.y -= SQUARE_SIZE; break;
                case 'Down': head.y += SQUARE_SIZE; break;
                case 'Left': head.x -= SQUARE_SIZE; break;
                case 'Right': head.x += SQUARE_SIZE; break;
            }
            
            // 边界检测
            if (head.x < 0 || head.x >= WIDTH || head.y < 0 || head.y >= HEIGHT) {
                if (lives > 1) {
                    lives--;
                    createParticles(head.x, head.y, '#FF0000');
                    resetSnake();
                    updateUI();
                    showHint("碰到边界！失去一条命", "#FF0000");
                    return;
                } else {
                    gameOver = true;
                    createParticles(head.x, head.y, '#FF0000');
                    showGameOver();
                    return;
                }
            }
            
            // 自身碰撞检测
            if (isPositionOnSnake(head)) {
                if (lives > 1) {
                    lives--;
                    createParticles(head.x, head.y, '#FF0000');
                    resetSnake();
                    updateUI();
                    showHint("碰到自己！失去一条命", "#FF0000");
                    return;
                } else {
                    gameOver = true;
                    createParticles(head.x, head.y, '#FF0000');
                    showGameOver();
                    return;
                }
            }
            
            // 食物碰撞检测
            if (isPositionOnFood(head)) {
                score += 10;
                createFood();
                createParticles(food.x, food.y, '#FF0000');
                showHint("+10分", "#00FF00");
                
                // 有几率生成传送门
                if (Math.random() < 0.2 && !portalActive) {
                    createPortal();
                    showHint("传送门出现！", "#00FFFF");
                }
                
                // 每获得50分升一级
                if (score % 50 === 0) {
                    level++;
                    gameSpeed = Math.max(50, 150 - (level - 1) * 10);
                    updateUI();
                    updateDifficulty();
                    showHint(`升级！当前关卡: ${level}`, "#FFFF00");
                } else {
                    updateUI();
                }
            } else if (isPositionOnPoison(head)) {
                score -= 5;
                if (score < 0) score = 0;
                createPoison();
                createParticles(poison.x, poison.y, '#9900FF');
                lives--;
                if (lives <= 0) {
                    gameOver = true;
                    showGameOver();
                    return;
                }
                resetSnake();
                updateUI();
                showHint("吃到毒苹果！-5分，失去一条命", "#9900FF");
            } else if (isPositionOnSpeedFood(head)) {
                score += 15;
                createSpeedFood();
                createParticles(speedFood.x, speedFood.y, '#FFFF00');
                powerUpActive = true;
                powerUpTime = 60;
                gameSpeed = Math.max(30, gameSpeed - 30);
                updateUI();
                showHint("加速状态！+15分", "#FFFF00");
            } else if (portalActive && isPositionOnPortal(head)) {
                // 传送到随机位置
                let newHead;
                do {
                    newHead = getRandomPosition();
                } while (isPositionOnSnake(newHead) || 
                        isPositionOnFood(newHead) ||
                        isPositionOnPoison(newHead) ||
                        isPositionOnSpeedFood(newHead));
                
                snake[0] = newHead;
                createParticles(portal.x, portal.y, '#00FFFF');
                portalActive = false;
                score += 20;
                updateUI();
                showHint("传送成功！+20分", "#00FFFF");
                return;
            } else {
                // 移除尾部
                snake.pop();
            }
            
            // 添加新头部
            snake.unshift(head);
            
            // 更新粒子
            updateParticles();
        }

        // 重置蛇的位置
        function resetSnake() {
            snake = [
                {x: 10 * SQUARE_SIZE, y: 10 * SQUARE_SIZE},
                {x: 9 * SQUARE_SIZE, y: 10 * SQUARE_SIZE},
                {x: 8 * SQUARE_SIZE, y: 10 * SQUARE_SIZE}
            ];
            direction = 'Right';
            nextDirection = 'Right';
        }

        // 绘制背景
        function drawBackground() {
            // 深色背景
            ctx.fillStyle = BG_COLOR;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // 网格线（轻微发光效果）
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
            ctx.lineWidth = 1;
            
            // 绘制垂直线
            for (let x = 0; x <= WIDTH; x += SQUARE_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, HEIGHT);
                ctx.stroke();
            }
            
            // 绘制水平线
            for (let y = 0; y <= HEIGHT; y += SQUARE_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(WIDTH, y);
                ctx.stroke();
            }
        }

        // 绘制蛇
        function drawSnake() {
            // 绘制蛇身
            for (let i = 1; i < snake.length; i++) {
                const segment = snake[i];
                
                // 渐变填充
                const gradient = ctx.createLinearGradient(
                    segment.x, segment.y, 
                    segment.x + SQUARE_SIZE, segment.y + SQUARE_SIZE
                );
                
                // 根据位置调整颜色，创造流动效果
                const hue = (i * 10 + Date.now() / 20) % 360;
                gradient.addColorStop(0, `hsl(${hue}, 100%, 40%)`);
                gradient.addColorStop(1, `hsl(${hue + 30}, 100%, 30%)`);
                
                // 圆形蛇身
                ctx.beginPath();
                ctx.arc(segment.x + SQUARE_SIZE/2, segment.y + SQUARE_SIZE/2, 
                        SQUARE_SIZE/2 - 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 高光效果
                const highlight = ctx.createRadialGradient(
                    segment.x + SQUARE_SIZE * 0.3, segment.y + SQUARE_SIZE * 0.3, 2,
                    segment.x + SQUARE_SIZE * 0.3, segment.y + SQUARE_SIZE * 0.3, SQUARE_SIZE/2
                );
                highlight.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                highlight.addColorStop(1, 'transparent');
                ctx.fillStyle = highlight;
                ctx.fill();
                
                // 边框
                ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // 绘制蛇头
            const head = snake[0];
            ctx.save();
            ctx.translate(head.x + SQUARE_SIZE/2, head.y + SQUARE_SIZE/2);
            ctx.rotate(directionToRadian(direction));
            
            // 霓虹效果
            ctx.filter = 'drop-shadow(0 0 10px rgba(0, 255, 0, 0.8))';
            ctx.drawImage(snakeHeadImg, -SQUARE_SIZE/2, -SQUARE_SIZE/2, SQUARE_SIZE, SQUARE_SIZE);
            ctx.filter = 'none';
            
            // 眼睛
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(-6, -4, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -4, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 瞳孔反光
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-7, -5, 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(5, -5, 1, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        // 绘制食物
        function drawFood() {
            ctx.save();
            
            // 食物呼吸效果
            const scale = 1 + Math.sin(Date.now() / 300) * 0.1;
            ctx.translate(food.x + SQUARE_SIZE/2, food.y + SQUARE_SIZE/2);
            ctx.scale(scale, scale);
            ctx.translate(-SQUARE_SIZE/2, -SQUARE_SIZE/2);
            
            // 霓虹效果
            ctx.filter = 'drop-shadow(0 0 15px rgba(255, 0, 0, 0.8))';
            ctx.drawImage(foodImg, 0, 0, SQUARE_SIZE, SQUARE_SIZE);
            ctx.filter = 'none';
            
            // 分数提示
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '12px Exo 2';
            ctx.textAlign = 'center';
            ctx.fillText('+10', SQUARE_SIZE/2, SQUARE_SIZE/2);
            
            ctx.restore();
        }

        // 绘制毒苹果
        function drawPoison() {
            ctx.save();
            
            // 毒苹果脉动效果
            const scale = 1 + Math.sin(Date.now() / 400) * 0.1;
            ctx.translate(poison.x + SQUARE_SIZE/2, poison.y + SQUARE_SIZE/2);
            ctx.scale(scale, scale);
            ctx.translate(-SQUARE_SIZE/2, -SQUARE_SIZE/2);
            
            // 霓虹效果
            ctx.filter = 'drop-shadow(0 0 10px rgba(150, 0, 255, 0.8))';
            ctx.drawImage(poisonImg, 0, 0, SQUARE_SIZE, SQUARE_SIZE);
            ctx.filter = 'none';
            
            // 警告提示
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '10px Exo 2';
            ctx.textAlign = 'center';
            ctx.fillText('-5', SQUARE_SIZE/2, SQUARE_SIZE/2);
            
            ctx.restore();
        }

        // 绘制加速果
        function drawSpeedFood() {
            if (!powerUpActive) return;
            
            ctx.save();
            
            // 加速果旋转效果
            ctx.translate(speedFood.x + SQUARE_SIZE/2, speedFood.y + SQUARE_SIZE/2);
            ctx.rotate(Date.now() / 1000);
            ctx.translate(-SQUARE_SIZE/2, -SQUARE_SIZE/2);
            
            // 霓虹效果
            ctx.filter = 'drop-shadow(0 0 10px rgba(255, 255, 0, 0.8))';
            ctx.drawImage(speedImg, 0, 0, SQUARE_SIZE, SQUARE_SIZE);
            ctx.filter = 'none';
            
            // 分数提示
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.font = '12px Exo 2';
            ctx.textAlign = 'center';
            ctx.fillText('+15', SQUARE_SIZE/2, SQUARE_SIZE/2);
            
            // 剩余时间指示器
            if (powerUpTime < 20) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.font = '10px Exo 2';
                ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(powerUpTime / 10), SQUARE_SIZE/2, SQUARE_SIZE - 8);
            }
            
            ctx.restore();
        }

        // 绘制传送门
        function drawPortal() {
            if (!portalActive) return;
            
            ctx.save();
            
            // 传送门旋转效果
            ctx.translate(portal.x + SQUARE_SIZE/2, portal.y + SQUARE_SIZE/2);
            ctx.rotate(-Date.now() / 1000);
            ctx.translate(-SQUARE_SIZE/2, -SQUARE_SIZE/2);
            
            // 霓虹效果
            ctx.filter = 'drop-shadow(0 0 15px rgba(0, 255, 255, 0.7))';
            ctx.drawImage(portalImg, 0, 0, SQUARE_SIZE, SQUARE_SIZE);
            ctx.filter = 'none';
            
            // 分数提示
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.font = '12px Exo 2';
            ctx.textAlign = 'center';
            ctx.fillText('+20', SQUARE_SIZE/2, SQUARE_SIZE/2);
            
            // 剩余时间指示器
            const timeLeft = Math.ceil(portalCooldown / 30);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.font = '10px Exo 2';
            ctx.textAlign = 'center';
            ctx.fillText(timeLeft, SQUARE_SIZE/2, SQUARE_SIZE - 8);
            
            ctx.restore();
        }

        // 绘制方向指示器
        function drawDirectionIndicator() {
            if (!gameRunning || gameOver) return;
            
            ctx.save();
            ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
            ctx.font = '16px Exo 2';
            ctx.textAlign = 'center';
            
            // 在蛇头附近显示方向
            const head = snake[0];
            let textX = head.x + SQUARE_SIZE/2;
            let textY = head.y - 15;
            
            // 根据方向调整位置，避免超出画布
            if (head.y < 30) {
                textY = head.y + SQUARE_SIZE + 20;
            }
            
            // 方向文本
            let directionText = '';
            switch(direction) {
                case 'Up': directionText = '↑'; break;
                case 'Down': directionText = '↓'; break;
                case 'Left': directionText = '←'; break;
                case 'Right': directionText = '→'; break;
            }
            
            // 添加霓虹效果
            ctx.shadowColor = '#0f0';
            ctx.shadowBlur = 10;
            ctx.fillText(directionText, textX, textY);
            
            ctx.restore();
        }

        // 绘制难度提示
        function drawDifficultyHint() {
            if (!gameRunning || gameOver) return;
            
            ctx.save();
            ctx.fillStyle = 'rgba(0, 255, 0, 0.6)';
            ctx.font = '14px Exo 2';
            ctx.textAlign = 'left';
            
            // 在右上角显示难度提示
            const hintText = `难度: ${getDifficultyText()} | 速度: ${Math.round((150 - gameSpeed) / 10)}/10`;
            ctx.fillText(hintText, 30, 50);
            
            // 绘制速度条
            const speedBarWidth = 200;
            const currentSpeed = 10 - Math.round((gameSpeed - 50) / 10);
            
            // 速度条背景
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(30, 65, speedBarWidth, 10);
            
            // 速度条填充
            const gradient = ctx.createLinearGradient(30, 65, 30 + speedBarWidth, 65);
            gradient.addColorStop(0, '#00FF00');
            gradient.addColorStop(0.5, '#FFFF00');
            gradient.addColorStop(1, '#FF0000');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(30, 65, (currentSpeed / 10) * speedBarWidth, 10);
            
            // 速度条标记
            ctx.fillStyle = 'white';
            ctx.font = '10px Exo 2';
            ctx.textAlign = 'center';
            ctx.fillText(currentSpeed, 30 + (currentSpeed / 10) * speedBarWidth, 63);
            
            ctx.restore();
        }

        // 获取难度文本
        function getDifficultyText() {
            if (level < 3) return '简单';
            if (level < 6) return '中等';
            if (level < 9) return '困难';
            return '极难';
        }

        // 更新难度显示
        function updateDifficulty() {
            document.getElementById('difficultyValue').textContent = `难度: ${getDifficultyText()}`;
        }

        // 绘制游戏开始引导
        function drawStartGuide() {
            ctx.save();
            
            // 半透明背景
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(WIDTH/2 - 150, HEIGHT/2 - 80, 300, 160);
            
            // 引导文字
            ctx.fillStyle = '#0f0';
            ctx.font = '24px Exo 2';
            ctx.textAlign = 'center';
            ctx.fillText('欢迎来到霓虹贪吃蛇！', WIDTH/2, HEIGHT/2 - 40);
            
            ctx.font = '16px Exo 2';
            ctx.fillText('使用方向键控制蛇的移动', WIDTH/2, HEIGHT/2);
            ctx.fillText('按空格键暂停/继续游戏', WIDTH/2, HEIGHT/2 + 30);
            
            // 闪烁提示
            const alpha = 0.5 + 0.5 * Math.sin(Date.now() / 300);
            ctx.fillStyle = `rgba(0, 255, 0, ${alpha})`;
            ctx.fillText('按任意方向键开始移动', WIDTH/2, HEIGHT/2 + 70);
            
            ctx.restore();
        }

        // 创建粒子效果
        function createParticles(x, y, color) {
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: x + SQUARE_SIZE/2,
                    y: y + SQUARE_SIZE/2,
                    color: color,
                    size: Math.random() * 4 + 2,
                    speed: {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    },
                    alpha: 1,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        // 显示提示信息
        function showHint(message, color) {
            // 创建提示粒子
            const hintParticle = {
                message: message,
                color: color,
                x: WIDTH/2,
                y: HEIGHT/2,
                alpha: 1,
                speed: {
                    x: 0,
                    y: -2
                },
                size: 24
            };
            
            // 添加到粒子数组
            particles.push(hintParticle);
        }

        // 更新粒子
        function updateParticles() {
            particles = particles.map(p => {
                if (p.message) {
                    // 提示文字
                    p.y += p.speed.y;
                    p.alpha -= 0.02;
                    p.size *= 0.98;
                } else {
                    // 普通粒子
                    p.x += p.speed.x;
                    p.y += p.speed.y;
                    p.alpha -= 0.02;
                    p.size *= 0.98;
                    p.rotation += p.rotationSpeed;
                }
                return p;
            }).filter(p => p.alpha > 0);
        }

        // 绘制粒子
        function drawParticles() {
            particles.forEach(p => {
                if (p.message) {
                    // 绘制提示文字
                    ctx.save();
                    ctx.fillStyle = `rgba(${hexToRgb(p.color)}, ${p.alpha})`;
                    ctx.font = `${Math.max(12, p.size)}px Exo 2`;
                    ctx.textAlign = 'center';
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.fillText(p.message, p.x, p.y);
                    ctx.restore();
                } else {
                    // 绘制普通粒子
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    
                    // 创建渐变
                    const gradient = ctx.createRadialGradient(
                        0, 0, 0,
                        0, 0, p.size
                    );
                    gradient.addColorStop(0, `rgba(${hexToRgb(p.color)}, ${p.alpha})`);
                    gradient.addColorStop(1, `rgba(${hexToRgb(p.color)}, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                }
            });
        }

        // 方向转弧度
        function directionToRadian(dir) {
            switch(dir) {
                case 'Up': return -Math.PI/2;
                case 'Down': return Math.PI/2;
                case 'Left': return Math.PI;
                case 'Right': return 0;
                default: return 0;
            }
        }

        // 十六进制颜色转RGB
        function hexToRgb(hex) {
            // 移除#号
            hex = hex.replace('#', '');
            
            // 解析RGB值
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            
            return `${r}, ${g}, ${b}`;
        }

        // 更新UI显示
        function updateUI() {
            document.getElementById('scoreValue').textContent = `分数: ${score}`;
            document.getElementById('livesValue').textContent = `生命: ${lives}`;
            document.getElementById('levelValue').textContent = `关卡: ${level}`;
            updateDifficulty();
        }

        // 开始游戏
        function startGame() {
            const startButton = document.querySelector('.neon-button');
            startButton.style.display = 'none';
            
            initGame();
            gameRunning = true;
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // 显示游戏结束
        function showGameOver() {
            const gameOverlay = document.createElement('div');
            gameOverlay.className = 'game-overlay';
            
            const gameOverText = document.createElement('div');
            gameOverText.className = 'game-over-text';
            gameOverText.textContent = '游戏结束';
            
            const finalScore = document.createElement('div');
            finalScore.className = 'final-score';
            finalScore.textContent = `最终得分: ${score}`;
            
            const restartButton = document.createElement('button');
            restartButton.className = 'neon-button';
            restartButton.innerHTML = '<i class="fa fa-refresh"></i> 重新开始';
            restartButton.onclick = function() {
                document.querySelector('.game-overlay').remove();
                initGame();
                gameRunning = true;
                gameLoopId = requestAnimationFrame(gameLoop);
            };
            
            gameOverlay.appendChild(gameOverText);
            gameOverlay.appendChild(finalScore);
            gameOverlay.appendChild(restartButton);
            
            document.querySelector('.game-container').appendChild(gameOverlay);
        }

        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (!gameRunning || gameOver) {
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    startGame();
                }
                return;
            }
            
            switch(e.key) {
                case 'ArrowUp':
                    if (direction !== 'Down') nextDirection = 'Up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'Up') nextDirection = 'Down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'Right') nextDirection = 'Left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'Left') nextDirection = 'Right';
                    break;
                case ' ': // 空格键暂停/继续
                    if (gameRunning && !gameOver) {
                        if (gameLoopId) {
                            cancelAnimationFrame(gameLoopId);
                            gameLoopId = null;
                            showHint("游戏暂停", "#FFFFFF");
                        } else {
                            gameLoopId = requestAnimationFrame(gameLoop);
                            showHint("游戏继续", "#00FF00");
                        }
                    }
                    break;
                case 'h': // H键显示帮助
                case 'H':
                    toggleHelp();
                    break;
            }
        });

        // 移动端控制
        function mobileControl(newDirection) {
            if (!gameRunning || gameOver) return;
            
            // 防止180度转向
            if ((newDirection === 'Up' && direction === 'Down') ||
                (newDirection === 'Down' && direction === 'Up') ||
                (newDirection === 'Left' && direction === 'Right') ||
                (newDirection === 'Right' && direction === 'Left')) {
                return;
            }
            
            nextDirection = newDirection;
        }

        // 触摸控制（移动端）
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        }, false);
        
        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, false);
        
        canvas.addEventListener('touchend', function(e) {
            if (!gameRunning || gameOver) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            // 判断滑动方向
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // 水平滑动
                if (diffX > 0 && direction !== 'Left') {
                    nextDirection = 'Right';
                } else if (diffX < 0 && direction !== 'Right') {
                    nextDirection = 'Left';
                }
            } else {
                // 垂直滑动
                if (diffY > 0 && direction !== 'Up') {
                    nextDirection = 'Down';
                } else if (diffY < 0 && direction !== 'Down') {
                    nextDirection = 'Up';
                }
            }
            
            e.preventDefault();
        }, false);

        // 切换帮助面板
        function toggleHelp() {
            const helpPanel = document.getElementById('helpPanel');
            helpPanel.style.display = helpPanel.style.display === 'none' || !helpPanel.style.display ? 'block' : 'none';
            
            // 暂停/继续游戏
            if (gameRunning && !gameOver) {
                if (helpPanel.style.display === 'block') {
                    if (gameLoopId) {
                        cancelAnimationFrame(gameLoopId);
                        gameLoopId = null;
                    }
                } else {
                    if (!gameLoopId) {
                        gameLoopId = requestAnimationFrame(gameLoop);
                    }
                }
            }
        }
    </script></body></html>
